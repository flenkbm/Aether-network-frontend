<html lang="ru">

    <script src="js/login.js"></script>
    <!---->
    <link rel="stylesheet" href="css/color-scheme.css">
    <link rel="stylesheet" href="css/login-style.css">

<body class="dark-mode">
    <header>
        <h1 id="title">Aether Network</h1>
        <img src="img/theme-toggler-dark.png" id="theme-toggler" onclick="toggleTheme()">
    </header>
    <main>
        <div id="reg-block">
            <div class="cont">
                <label for="nickname">Никнейм:</label>
                <input type="text" id="nickname-input" name="nickname" placeholder="VasyaPupkin">
                <label for="pswd">Пароль:</label>
                <input type="password" id="password-input" name="pswd" placeholder="SuperPassword3000">
                <button id="submit" onclick="login()">Войти</button>
            </div>
            <div class="overlay hidden">
                <div id="loading-circle" class="hidden"></div>
                <div id="result-message" class="hidden"></div>
                <button id="after-action"></button>
            </div>
        </div>
    </main>
