<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!---->
    <script src="js/func.js"></script>
    <script src="js/screen-size-getter.js"></script>
    <script src="js/style-switch.js"></script>
    <script src="js/login.js"></script>
    <!---->
    <link rel="stylesheet" href="css/color-scheme.css">
    <link rel="stylesheet" href="css/login-style.css">
    <link rel="stylesheet" href="css/header-style.css">
    <!---->
    <title>Aether network - login</title>
</head>
<body class="dark-mode">
    <header>
        <h1 id="title">Aether Network</h1>
        <img src="img/theme-toggler-dark.png" id="theme-toggler" onclick="toggleTheme()">
    </header>
    <main>
        <div id="reg-block">
            <div class="cont">
                <label for="nickname">Никнейм:</label>
                <input type="text" id="nickname-input" name="nickname" placeholder="VasyaPupkin">
                <label for="pswd">Пароль:</label>
                <input type="password" id="password-input" name="pswd" placeholder="SuperPassword3000">
                <button id="submit" onclick="login()">Войти</button>
                <a href="registration.html" id="to-reg">Нет аккаунта? <span>Регистрация</span></a>
            </div>
            <div id="overlay" class="hidden">
                <div id="result-message"></div>
                <div id="loading-circle"><div id="loading-circle-inner"></div></div>
                <button id="after-action"></button>
            </div>
        </div>
    </main>
</body>
</html>
