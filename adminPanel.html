<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!---->
    <script src="js/func.js"></script>
    <script src="js/screen-size-getter.js"></script>
    <!---->
    <link rel="stylesheet" href="css/color-scheme.css">
    <link rel="stylesheet" href="css/header-style.css">
    <!---->
    <title>Aether network</title>
    <script>
        //localStorage.clear();
        //console.log(window.location);
    </script>
</head>
<body class="dark-mode">
    <header>
        <h1 id="title">Aether Network</h1>
    </header>
    <main>
        <script>
            function showres(res){
                resplace = document.getElementById("result");
                console.log(res);
                animRewrite(resplace, res, 2);
            }
        </script>
        <div id="floating">
            <p id="result">result will be here</p>
            <p id="admin-code-hd">Admin code:</p>
            <input type="password" id="admin-code" placeholder="admin code">
        </div>
        <script>
            admin_code = localStorage.getItem("Aether-admin-code");
            document.getElementById("admin-code").value = admin_code;
        </script>
        <div class="command-block">
            <h3>Make code</h3>
            <input type="text" id="1-code-inp" placeholder="uuid4-code">
            <input type="text" id="1-element-inp" placeholder="element for reward">
            <input type="text" id="1-elem-count-inp" placeholder="amount of element">
            <input type="text" id="1-EXP-inp" placeholder="amount of EXP">
            <input type="text" id="1-cooldown-inp" placeholder="cooldown (in ms)">
            <button class="submit" onclick="makecode()">Enter &lt;/></button>
        </div>
        <script>
            function makecode(){
                showres("attempting makecode");
                fetch(API+"makecode", {
                    method: "POST",
                    body: JSON.stringify({
                        code: document.getElementById("1-code-inp").value,
                        element: document.getElementById("1-element-inp").value,
                        amount: document.getElementById("1-elem-count-inp").value,
                        EXP: document.getElementById("1-EXP-inp").value,
                        cooldown: document.getElementById("1-cooldown-inp").value,
                        password: document.getElementById("admin-code").value
                    }),
                    headers: {
                        "Content-type": "application/json; charset=UTF-8"
                    }
                })
                .then((response) => response.text())
                .then((text) => {
                    setTimeout(function () {
                        showres(text)
                    }, 1000)  
                })
            }
        </script>
        <div class="command-block">
            <h3>Modify user</h3>
            <input type="text" id="2-username-inp" placeholder="username">
            <input type="text" id="2-variable-inp" placeholder="variable">
            <input type="text" id="2-value-inp" placeholder="value">
            <button class="submit" onclick="modifyuser()">Enter &lt;/></button>
        </div>
        <script>
            function modifyuser(){
                showres("attempting modifyuser");
                fetch(API+"admin/"+"modifyuser", {
                    method: "POST",
                    body: JSON.stringify({
                        username: document.getElementById("2-username-inp").value,
                        variable: document.getElementById("2-variable-inp").value,
                        value: document.getElementById("2-value-inp").value,
                        password: document.getElementById("admin-code").value
                    }),
                    headers: {
                        "Content-type": "application/json; charset=UTF-8"
                    }
                })
                .then((response) => response.text())
                .then((text) => {
                    setTimeout(function () {
                        showres(text)
                    }, 1000)  
                })
            }
        </script>
        <div class="command-block">
            <h3>Get user</h3>
            <input type="text" id="3-username-inp" placeholder="username">
            <button class="submit" onclick="getuser()">Enter &lt;/></button>
        </div>
        <script>
            function getuser(){
                showres("attempting getuser");
                fetch(API+"admin/"+"getuser", {
                    method: "POST",
                    body: JSON.stringify({
                        username: document.getElementById("3-username-inp").value,
                        password: document.getElementById("admin-code").value
                    }),
                    headers: {
                        "Content-type": "application/json; charset=UTF-8"
                    }
                })
                .then((response) => response.text())
                .then((text) => {
                    setTimeout(function () {
                        showres(text)
                    }, 1000)  
                })
            }
        </script>
        <div class="command-block">

        </div>
        <script>
            function smth(){
                showres("attempting smth");
                fetch(API+"admin/"+"", {
                    method: "POST",
                    body: JSON.stringify({
                        smth: document.getElementById("").value,
                        password: document.getElementById("admin-code").value
                    }),
                    headers: {
                        "Content-type": "application/json; charset=UTF-8"
                    }
                })
                .then((response) => response.text())
                .then((text) => {
                    setTimeout(function () {
                        showres(text)
                    }, 1000)  
                })
            }
        </script>
        <div id="tech"></div>
    </main>
    <style>
        * {
            margin: 0;
            padding: 0;
            transition: 0.3s;
            transition-property: background, color, background-color, src;
            font-family: 'Segoe UI', Tahoma, sans-serif; 
        }
        p, h1, h2, h3, h4, h5 {
            color: var(--text-main);
            width: fit-content;
        }

        body {
            background: var(--bg-main);
        }

        main {
            --main-padding-w: 7%;
            padding: 20px var(--main-padding-w);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: nowrap;
        }

        div.command-block {
            border-image-source: url("img/border-slice-X-acc.png");
            border-image-repeat: round;
            border-image-slice: 10;
            --bord-w: 5px;
            border-image-width: var(--bord-w);
            border-image-outset: var(--bord-w);
            background-color: var(--bg-sec-dk);
            margin-bottom: 45px;
            /**/
            padding: min(20px, 5%);
            --t-w: min(calc(var(--screen-w) - var(--main-padding-w)*2 - var(--bord-w)*2 - min(20px, 5%)*2), 400px);
            width: var(--t-w);
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            *{
                margin-bottom: 2px;
            }
            input {
                background-color: var(--bg-sec-X-lt);
                border: solid 2px var(--border-2);
                border-radius: 5px;
                padding: 2px;
                color: var(--text-sec-X-acc);
                width: 70%;
                font-size: 15px;
            }
            input::placeholder {
                color: var(--text-sec-acc);
            }
            input:focus {
                outline: none;
                border: dashed 2px var(--border-2-acc);
            }
            button.submit {
                background-color: var(--bg-dk);
                border: solid 3px var(--border-main);
                height: 40px;
                width: 80%;
                align-self: center;
                margin-top: auto;
                color: var(--text-main-acc);
                font-weight: 500;
                font-size: 20px;
                font-family: 'Courier New', Courier, monospace;
            }
        }

        div#floating {
            --bord-w: 5px;
            border: 5px solid var(--border-4);
            background-color: var(--bg-lt);
            /**/
            padding: min(20px, 5%);
            --t-w: min(calc(var(--screen-w) - var(--main-padding-w)*2 - var(--bord-w)*2 - min(20px, 5%)*2 + 10px), 410px);
            width: var(--t-w);
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            p {
                color: var(--text-main-acc);
            }
            p#admin-code-hd {
                margin-top: auto;
                margin-bottom: 5px;
            }
            p#result {
                width: 100%;
                word-wrap: break-word;
            }
            input {
                background-color: var(--bg-sec-X-lt);
                border: solid 2px var(--border-2);
                border-radius: 5px;
                padding: 2px;
                color: var(--text-sec-X-acc);
                width: 100%;
            }
            input::placeholder {
                color: var(--text-sec-acc);
            }
            input:focus {
                outline: none;
                border: dashed 2px var(--border-2-acc);
            }
        }
        @media (max-width: 540px) {
            div#floating {
                position: fixed;
                top: calc(55px + 20px + 220px + 40px + 45px - 20px);
            }
            div#tech {
                height: 240px;
            }
        }
        @media (min-width: 540px) {
            div#floating {
                position: fixed;
                width: 350px;
                top: calc(55px + 20px - 5px);
                right: 3%;
            }
        }
    </style>
</body>
</html>
