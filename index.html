<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!---->
    <script src="js/screen-size-getter.js"></script>
    <script src="js/style-switch.js"></script>
    <script src="js/index-data-loader.js"></script>
    <!---->
    <link rel="stylesheet" href="css/color-scheme.css">
    <link rel="stylesheet" href="css/index-style.css">
    <link rel="stylesheet" href="css/header-style.css">
    <!---->
    <title>Aether network</title>
    <script>
        //localStorage.clear();
        //console.log(window.location);
    </script>
</head>
<body class="dark-mode">
    <header>
        <h1 id="title">Aether Network</h1>
        <img src="img/theme-toggler-dark.png" id="theme-toggler" onclick="toggleTheme()">
    </header>
    <main>
        <div id="account-block">
            <div class="top-block">
                <h2 id="nickname">nickname</h2>
                <p id="lvl">lvl __</p>
            </div>
            <div id="xp-block">
                <p id="xp-disp">EXP ___/___</p>
                <div id="xp-bar"></div>
            </div>
            <p id="total-progress">Прогресс сбора элементов: __ из __</p>
        </div>
        <div id="scanner-block">

        </div>
        <button onclick="localStorage.removeItem('Aether-user')" class="temp">Временная кнопка выхода</button>
        <style>
            button.temp {
                margin-top: 20px;
                width: 100px;
                background-image: linear-gradient(120deg, var(--bg-sec-X-lt) -20%, var(--bg-sec-lt));
                color: var(--text-sec-acc);
                border: none;
                border-image-source: url("img/border-slice-X-acc-dark.png");;
                border-image-repeat: round;
                border-image-slice: 10;
                border-image-width: 4px;
                border-image-outset: 4px;
            }
        </style>
    </main>
</body>
</html>
