<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!---->
    <script src="https://unpkg.com/qr-scanner" type="module"></script>
    <script src="js/func.js"></script>
    <script src="js/screen-size-getter.js"></script>
    <script src="js/index-data-loader.js"></script>
    <script src="js/scanner.js"></script>
    <!---->
    <link rel="stylesheet" href="css/color-scheme.css">
    <link rel="stylesheet" href="css/index-style.css">
    <link rel="stylesheet" href="css/header-style.css">
    <!---->
    <title>Aether network</title>
    <script>
        //localStorage.clear();
        //console.log(window.location);
    </script>
</head>
<body class="dark-mode">
    <header>
        <h1 id="title">Aether Network</h1>
        <img src="img/logout-btn.png" id="logout-btn" onclick="localStorage.removeItem('Aether-user');location.reload()">
    </header>
    <main>
        <div id="account-block">
            <div class="top-block">
                <h2 id="username">________________</h2>
                <p id="lvl">lvl __</p>
            </div>
            <div id="xp-block">
                <p id="xp-disp">EXP ___/___</p>
                <div id="xp-bar" style="--xp-percent: 0%;"><div id="xp-bar-inner"></div></div>
            </div>
            <p id="total-progress">Прогресс сбора элементов: __ из __</p>
        </div>
        <div id="scanner-block">
            <button id="start-scan" onclick="startScanner()">Включить сканер</button>
            <div id="vid-cont" class="hidden">
                <video id="scan-vid-disp"></video>
            </div>
            <button id="stop-scan" onclick="stopScanner('cancel')" class="hidden">Выключить сканер</button>
        </div>
    </main>
</body>
</html>
